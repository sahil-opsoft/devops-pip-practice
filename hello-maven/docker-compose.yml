name: hello-stack

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pip
      POSTGRES_USER: pip
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pip -d pip"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  app:
    build: .
    image: sahilopsoft/hello-maven:1.0
    ports:
      - "8085:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/pip
      DB_USER: pip
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

volumes:
  db-data:

networks:
  backend:
