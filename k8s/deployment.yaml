apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-maven
  labels:
    app: hello-maven
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-maven
  template:
    metadata:
      labels:
        app: hello-maven
    spec:
      containers:
        - name: hello-maven
          image: sahilopsoft/hello-maven:163242a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
