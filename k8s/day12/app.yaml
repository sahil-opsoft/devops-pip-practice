apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-maven
  namespace: pip-app
  labels:
    app: hello-maven
  annotations:
    kubernetes.io/change-cause: "v2 a9adc95 + preStop hook for graceful shutdown"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hello-maven
  template:
    metadata:
      labels:
        app: hello-maven
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: hello-maven
          image: sahilopsoft/hello-maven:a9adc95
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hello-maven-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: hello-maven-db, key: DB_PASSWORD }
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hello-maven
  namespace: pip-app
spec:
  type: ClusterIP
  selector:
    app: hello-maven
  ports:
    - name: http
      port: 80
      targetPort: http
