apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retry
  namespace: pip-app
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-maven
  namespace: pip-app
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: pip-app-retry@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: hello.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-maven
                port:
                  name: http
